<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bible Quiz V4 — Flow Map</title>
  <style>
    :root {
      --bg: #faf5e2;
      --panel: #fff;
      --ink: #1a1a1a;
      --muted: #5c5c5c;
      --border: #e8d9a8;
      --accent: #2d8a6a;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; background: var(--bg); color: var(--ink); }
    header { padding: 16px 20px; border-bottom: 1px solid var(--border); background: #a6e6b5; position: sticky; top: 0; z-index: 10; }
    header h1 { margin: 0 0 6px; font-size: 1.25rem; }
    header p { margin: 0; font-size: 0.9rem; color: #234; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; align-items: center; }
    .toolbar button, .toolbar label { font: inherit; }
    .toolbar button { padding: 6px 12px; border: 1px solid var(--border); background: #f6e9bd; cursor: pointer; border-radius: 6px; }
    .toolbar button.active { background: #fff; border-color: var(--accent); font-weight: 600; }
    .toolbar input { padding: 6px 10px; border: 1px solid var(--border); border-radius: 6px; min-width: 120px; }
    main { display: grid; grid-template-columns: 1fr 380px; min-height: calc(100vh - 120px); }
    @media (max-width: 960px) { main { grid-template-columns: 1fr; } #detail { order: -1; max-height: 40vh; } }
    #canvas-wrap { overflow: auto; position: relative; background: repeating-linear-gradient(0deg, transparent, transparent 199px, #00000008 199px, #00000008 200px), repeating-linear-gradient(90deg, transparent, transparent 279px, #00000008 279px, #00000008 280px); }
    #graph { position: relative; min-width: 800px; min-height: 600px; }
    svg.edges { position: absolute; inset: 0; pointer-events: none; overflow: visible; }
    .node { position: absolute; width: 220px; padding: 10px 12px; border: 2px solid var(--border); border-radius: 10px; background: var(--panel); cursor: pointer; box-shadow: 0 2px 8px #0001; transition: box-shadow .15s, transform .15s; }
    .node:hover { box-shadow: 0 4px 16px #0002; transform: translateY(-1px); }
    .node.selected { border-color: var(--accent); box-shadow: 0 0 0 3px #2d8a6a44; }
    .node.dim { opacity: 0.25; }
    .node .id { font-weight: 700; font-size: 0.85rem; color: var(--accent); }
    .node .sub { font-size: 0.75rem; color: var(--muted); margin-bottom: 4px; }
    .node .preview { font-size: 0.78rem; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .node.bridge { border-style: dashed; background: #f9fafb; }
    .node.final { border-color: #1d4ed8; }
    #timeline { display: none; padding: 20px; max-width: 900px; }
    #timeline.active { display: block; }
    #timeline .step { margin-bottom: 24px; padding-left: 16px; border-left: 4px solid var(--border); }
    #timeline .step h3 { margin: 0 0 8px; }
    #timeline .choices { margin: 0; padding-left: 18px; }
    #timeline .choices li { margin-bottom: 6px; }
    #detail { border-left: 1px solid var(--border); background: var(--panel); overflow: auto; padding: 16px; }
    #detail h2 { margin: 0 0 8px; font-size: 1.1rem; }
    #detail .scene-text { line-height: 1.5; margin-bottom: 16px; white-space: pre-wrap; }
    #detail .choice-block { border: 1px solid var(--border); border-radius: 8px; padding: 10px; margin-bottom: 8px; background: #fafafa; }
    #detail .choice-block .next { font-size: 0.85rem; color: var(--muted); margin-top: 6px; }
    #detail .scores { font-size: 0.8rem; color: var(--muted); margin-top: 4px; }
    .empty { color: var(--muted); font-style: italic; }
  </style>
</head>
<body>
  <header>
    <h1>Bible Quiz V4 — Scene Flow Map</h1>
    <p>All scenes, full story text, and branch progression. Generated from BIBLE-CHARACTER-QUIZ.md</p>
    <div class="toolbar">
      <button type="button" id="view-graph" class="active">Graph view</button>
      <button type="button" id="view-timeline">Path timeline</button>
      <span style="margin-left:8px">Path filter:</span>
      <button type="button" data-path="all" class="path-btn active">All paths</button>
      <button type="button" data-path="valley" class="path-btn">Valley</button>
      <button type="button" data-path="hills" class="path-btn">Hills</button>
      <button type="button" data-path="river" class="path-btn">River</button>
      <button type="button" data-path="wilderness_journal" class="path-btn">Wilderness A</button>
      <button type="button" data-path="wilderness_noise" class="path-btn">Wilderness B</button>
      <label>Jump to scene <input type="number" id="jump-scene" min="1" max="51" placeholder="#" /></label>
    </div>
  </header>
  <main>
    <div id="canvas-wrap">
      <div id="graph"></div>
      <div id="timeline"></div>
    </div>
    <aside id="detail"><p class="empty">Click a scene node or timeline step to read full text and choices.</p></aside>
  </main>
  <script>
    const DATA = {"paths":{"valley":{"label":"Valley","color":"#2d8a6a","scenes":[1,2,3,7,8,49,10,43,39,44,12,19,20,21,22,51,23,24,27,13]},"hills":{"label":"Hills","color":"#c9782d","scenes":[1,2,4,15,16,17,50,18,19,20,21,22,51,23,24,27,13]},"river":{"label":"River","color":"#2d6fc9","scenes":[1,2,5,28,45,30,46,32,19,20,21,22,51,23,24,27,13]},"wilderness_journal":{"label":"Wilderness (journal branch)","color":"#7a4dc9","scenes":[1,2,6,33,34,37,38,19,20,21,22,51,23,24,27,13]},"wilderness_noise":{"label":"Wilderness (night noise branch)","color":"#9a5dc9","scenes":[1,2,6,33,36,37,38,19,20,21,22,51,23,24,27,13]}},"nodes":[{"id":1,"subtitle":"START","text":"A star appears in the sky. Not like a normal star. This one is aggressively bright — like it WANTS to be followed. A group of strangers is already packing bags. You grab yours. What's coming with you?","choices":[{"label":"Bread, water, and an extra waterskin — basics covered","nextId":2,"women":"Martha, Abigail, Esther","men":"Joseph, Nehemiah, Paul"},{"label":"Coins — you never know what we'll need to buy","nextId":2,"women":"Ruth, Abigail, Hannah","men":"Peter, Barnabas, Abraham"},{"label":"A journal and ink — someone has to write this down","nextId":2,"women":"Mary Magdalene, Hannah, Esther","men":"Daniel, Joseph, Abraham"},{"label":"A knife — for fires, protection… who knows what's out there","nextId":2,"women":"Deborah, Mary (Mother), Miriam","men":"David, Elijah, Moses"}],"isTransition":false,"isFinal":false,"col":0,"lane":2,"lanes":[0,1,2,3,4],"x":40,"y":440},{"id":2,"subtitle":"First Branch","text":"Dawn. The road splits four ways. Because of course it does. A merchant swears the valley is the safest road — if you don't mind the extra miles. A shepherd jabs his thumb at the hills — steeper, but a straighter line toward the light. Neither of them is coming with you. Helpful. So — which way?","choices":[{"label":"Take the valley road — longest route, but safest","nextId":3,"women":"Martha, Ruth, Priscilla","men":"Paul, Daniel, Moses"},{"label":"Climb the hills — steeper, but a straight line toward the star","nextId":4,"women":"Deborah, Priscilla, Esther","men":"David, Nehemiah, Barnabas"},{"label":"Follow the river — slow, and it might flood, but hard to get lost","nextId":5,"women":"Ruth, Mary Magdalene, Mary (Mother)","men":"Daniel, Peter, Nehemiah"},{"label":"Cut through the wilderness — shortest way, least safe","nextId":6,"women":"Deborah, Ruth, Mary Magdalene","men":"Peter, Moses, Daniel"}],"isTransition":false,"isFinal":false,"col":1,"lane":2,"lanes":[0,1,2,3,4],"x":320,"y":440},{"id":3,"text":"The valley road is easy. Suspiciously easy. By midday, you spot a woman at a well, face in her hands. She's been here since before sunrise — her son is sick and the nearest healer is a full day's walk. Someone behind you mutters, 'We really should keep moving.' Wow. Thanks, guy.","choices":[{"label":"Turn the group around — walk her toward the healer, even if we lose half a day","nextId":7,"women":"Miriam, Ruth, Hannah","men":"David, Elijah, Joseph"},{"label":"Fill her jars, mark the path, and keep moving","nextId":7,"women":"Esther, Abigail, Ruth","men":"Joseph, Peter, Paul"},{"label":"Press a coin into her hand and tell her which way the healer lives","nextId":7,"women":"Priscilla, Miriam, Mary Magdalene","men":"Moses, Nehemiah, Joseph"},{"label":"Make the group wait — sit with her until she can breathe again","nextId":7,"women":"Deborah, Abigail, Miriam","men":"Elijah, Abraham, Paul"}],"isTransition":false,"isFinal":false,"col":2,"lane":0,"lanes":[0],"x":600,"y":40},{"id":4,"text":"The hills are beautiful. The hills are also steep. By afternoon, the trail forks. Because apparently one difficult choice per day isn't enough. Which way?","choices":[{"label":"Take the steep switchback — lungs burn, hours saved","nextId":15,"women":"Deborah, Miriam, Mary (Mother)","men":"Nehemiah, Joseph, Abraham"},{"label":"Take the longer ridge walk — easier on the legs, costs daylight","nextId":15,"women":"Esther, Miriam, Ruth","men":"Moses, David, Abraham"},{"label":"Stop the group — make them vote while you're all standing here","nextId":15,"women":"Esther, Hannah, Mary Magdalene","men":"Elijah, Abraham, Paul"}],"isTransition":false,"isFinal":false,"col":2,"lane":1,"lanes":[1],"x":600,"y":240},{"id":5,"text":"Kids. There are kids playing by the river, skipping stones. They seem completely unbothered by anything — must be nice to be that carefree. What do you do?","choices":[{"label":"Put down your pack — pick up a flat stone and throw","nextId":28,"women":"Priscilla, Miriam, Hannah","men":"Daniel, Abraham, Barnabas"},{"label":"Wave, keep walking — don't break stride","nextId":28,"women":"Esther, Hannah, Mary Magdalene","men":"Joseph, Peter, Barnabas"},{"label":"Scan the bank — \"Who's watching you?\"","nextId":28,"women":"Abigail, Miriam, Martha","men":"David, Peter, Paul"},{"label":"Keep your eyes on the star — walk past without stopping","nextId":28,"women":"Deborah, Hannah, Mary (Mother)","men":"David, Elijah, Abraham"}],"isTransition":false,"isFinal":false,"col":2,"lane":2,"lanes":[2],"x":600,"y":440},{"id":6,"text":"No paths. No signs. Just you, the star, and the growing realization that this was maybe not your best decision. Someone behind you mutters, 'Are we lost?' How do you respond?","choices":[{"label":"Point at the star — \"It's still there. We follow it.\"","nextId":33,"women":"Abigail, Mary (Mother), Martha","men":"David, Daniel, Joseph"},{"label":"Stop walking — \"Turn back now if you need to. No shame.\"","nextId":33,"women":"Abigail, Priscilla, Miriam","men":"Abraham, Paul, Barnabas"},{"label":"Pass the lead to someone else — \"Your turn at the front.\"","nextId":33,"women":"Esther, Mary Magdalene, Martha","men":"Moses, Joseph, Barnabas"}],"isTransition":false,"isFinal":false,"col":2,"lane":3,"lanes":[3,4],"x":600,"y":640},{"id":7,"subtitle":"Transition","text":"The afternoon sun is brutal. A village appears ahead — but every door is shut and the streets are empty. You knock. Nothing. The group falls quiet. Cool. Not ominous at all.","choices":[{"label":"Continue","nextId":8,"women":"","men":"","isBridge":true}],"isTransition":true,"isFinal":false,"col":3,"lane":0,"lanes":[0],"x":880,"y":40},{"id":8,"text":"An old man shuffles out. 'Soldiers came through yesterday. Took everything — every last scrap of food.' He looks at your group like you might be his last hope. Your group immediately starts arguing about rations. Someone uses the phrase 'resource allocation.' This is going great. What do you decide?","choices":[{"label":"Empty the packs onto the ground — we eat thin tonight","nextId":49,"women":"Priscilla, Hannah, Mary (Mother)","men":"Elijah, Nehemiah, Peter"},{"label":"Split every bag down the middle — one pile for them, one for us","nextId":49,"women":"Deborah, Mary Magdalene, Martha","men":"Moses, Abraham, Peter"},{"label":"Don't share a bite of food until he tells us where the soldiers went","nextId":49,"women":"Abigail, Hannah, Mary Magdalene","men":"Daniel, Joseph, Barnabas"},{"label":"Keep our food — but I'll go door to door and see who else is hiding","nextId":49,"women":"Deborah, Esther, Mary (Mother)","men":"Moses, Paul, Barnabas"}],"isTransition":false,"isFinal":false,"col":4,"lane":0,"lanes":[0],"x":1160,"y":40},{"id":10,"text":"A kid in the group tugs your sleeve. 'What if the star leads nowhere?' She's looking at you like you might actually know the answer.","choices":[{"label":"Crouch down — point at the star and make her look up","nextId":43,"women":"Deborah, Abigail, Martha","men":"Moses, Daniel, Barnabas"},{"label":"Pull her into the circle by the fire — don't let her sit alone","nextId":43,"women":"Deborah, Esther, Ruth","men":"Moses, Nehemiah, Joseph"},{"label":"Admit you're scared — then ask her to walk beside you tomorrow","nextId":43,"women":"Abigail, Ruth, Mary (Mother)","men":"David, Peter, Barnabas"},{"label":"Say nothing — just stay next to her until she falls asleep","nextId":43,"women":"Deborah, Priscilla, Mary (Mother)","men":"Elijah, Paul, Barnabas"}],"isTransition":false,"isFinal":false,"col":6,"lane":0,"lanes":[0],"x":1720,"y":40},{"id":12,"text":"Each night, the star burns brighter. Someone beside you whispers, 'What do you think it means?' You don't have words for that yet. What do you do instead?","choices":[{"label":"Pick up the pace — the star is almost close enough to touch","nextId":19,"women":"Abigail, Priscilla, Miriam","men":"Moses, Nehemiah, Paul"},{"label":"Double the night watch — something feels off","nextId":19,"women":"Priscilla, Ruth, Hannah","men":"Moses, David, Abraham"},{"label":"Find the person you've walked beside longest — tell them that out loud","nextId":19,"women":"Miriam, Hannah, Mary Magdalene","men":"Abraham, Paul, Barnabas"}],"isTransition":false,"isFinal":false,"col":10,"lane":0,"lanes":[0],"x":2840,"y":40},{"id":13,"subtitle":"FINAL QUESTION","text":"Home again. The star is gone. The road is behind you. But something in you is different now. What's your first move?","choices":[{"label":"Walk to the roof or garden where no one will interrupt you","nextId":"RESULT","women":"Esther, Miriam, Ruth","men":"David, Joseph, Paul"},{"label":"Open the shop, field, or ledger — start where you left off","nextId":"RESULT","women":"Abigail, Miriam, Mary Magdalene","men":"Nehemiah, Joseph, Peter"},{"label":"Gather your family at the table — start from the star","nextId":"RESULT","women":"Miriam, Mary (Mother), Martha","men":"Moses, Elijah, Joseph"},{"label":"Spread the map on the floor — you're already thinking about what's next","nextId":"RESULT","women":"Deborah, Miriam, Hannah","men":"Joseph, Abraham, Barnabas"}],"isTransition":false,"isFinal":true,"col":19,"lane":2,"lanes":[0,1,2,3,4],"x":5360,"y":440},{"id":15,"text":"A hermit emerges from a cave. Of course there's a hermit. 'What brings you this way?' he asks, like people just casually wander past his cave all the time.","choices":[{"label":"Point up — \"That star. We're walking toward it.\"","nextId":16,"women":"Deborah, Ruth, Hannah","men":"David, Peter, Barnabas"},{"label":"Shrug — \"Honestly? We don't know yet. But we're going.\"","nextId":16,"women":"Abigail, Hannah, Mary (Mother)","men":"Daniel, Peter, Paul"},{"label":"Keep moving your feet — \"Travelers. Nice cave. Can we rest?\"","nextId":16,"women":"Abigail, Ruth, Mary Magdalene","men":"Moses, Joseph, Barnabas"}],"isTransition":false,"isFinal":false,"col":3,"lane":1,"lanes":[1],"x":880,"y":240},{"id":16,"text":"The hermit strokes his beard — he absolutely has a beard — and his eyes go distant. 'The old writings speak of a star like this. A sign of something... beginning.' He looks at you. 'You sure you want to find what's at the end of it?' You're not sure if that was a warning or a blessing.","choices":[{"label":"Lean in — \"Explain that. What beginning?\"","nextId":17,"women":"Esther, Miriam, Ruth","men":"David, Nehemiah, Joseph"},{"label":"Drop your pack by the fire — \"Then we rest while we can.\"","nextId":17,"women":"Deborah, Abigail, Miriam","men":"Moses, David, Paul"},{"label":"Sit cross-legged — \"You look like you've seen things. Tell us one.\"","nextId":17,"women":"Abigail, Priscilla, Martha","men":"Elijah, Daniel, Barnabas"}],"isTransition":false,"isFinal":false,"col":4,"lane":1,"lanes":[1],"x":1160,"y":240},{"id":17,"subtitle":"Transition","text":"In the morning, the hermit is gone. Vanished. But the fire is still warm, and there's fresh water by the entrance. You leave an extra waterskin by the cold fire — payment for a host who vanished.","choices":[{"label":"Continue","nextId":50,"women":"","men":"","isBridge":true}],"isTransition":true,"isFinal":false,"col":5,"lane":1,"lanes":[1],"x":1440,"y":240},{"id":18,"text":"From the summit, you can see... everything. Valleys, villages, the curve of the earth. The star is impossibly bright from up here. Nobody speaks for a while. You're the one who breaks the silence.","choices":[{"label":"Sit on the rock edge — let the wind hit your face","nextId":19,"women":"Esther, Priscilla, Ruth","men":"Moses, Abraham, Barnabas"},{"label":"Point at the glow on the horizon — \"There. That's it.\"","nextId":19,"women":"Esther, Hannah, Mary Magdalene","men":"Moses, Nehemiah, Joseph"},{"label":"Walk the line — count heads, check ankles and water","nextId":19,"women":"Priscilla, Mary (Mother), Mary Magdalene","men":"Elijah, Joseph, Paul"}],"isTransition":false,"isFinal":false,"col":7,"lane":1,"lanes":[1],"x":2000,"y":240},{"id":19,"text":"Checkpoint ahead. Soldiers. Stopping everyone. Your group exchanges nervous glances. Someone whispers, 'Act natural.' Very helpful. What's the plan?","choices":[{"label":"Walk to the front — answer every question yourself","nextId":20,"women":"Abigail, Ruth, Martha","men":"Elijah, Daniel, Abraham"},{"label":"Link arms — no one speaks unless the whole group is present","nextId":20,"women":"Deborah, Miriam, Martha","men":"David, Daniel, Joseph"},{"label":"Scan the tree line — there has to be another detour","nextId":20,"women":"Esther, Miriam, Mary (Mother)","men":"Elijah, Nehemiah, Peter"},{"label":"Smile, show empty hands, and let them search the bags","nextId":20,"women":"Deborah, Esther, Abigail","men":"Joseph, Abraham, Peter"}],"isTransition":false,"isFinal":false,"col":11,"lane":2,"lanes":[0,1,2,3,4],"x":3120,"y":440},{"id":20,"text":"The soldier squints at you. 'So you're following... a star.' His skepticism is obvious. 'That's really what you're doing?'","choices":[{"label":"\"Yes. Weird, I know. But here we are.\"","nextId":21,"women":"Priscilla, Miriam, Hannah","men":"David, Paul, Barnabas"},{"label":"\"We're pilgrims. We mean no trouble.\"","nextId":21,"women":"Esther, Ruth, Mary Magdalene","men":"Moses, David, Elijah"},{"label":"\"Curious travelers. That's all.\"","nextId":21,"women":"Hannah, Mary (Mother), Mary Magdalene","men":"Moses, Daniel, Barnabas"}],"isTransition":false,"isFinal":false,"col":12,"lane":2,"lanes":[0,1,2,3,4],"x":3400,"y":440},{"id":21,"text":"The soldier pauses. Looks at the star. Back at you. 'I've thought about following it myself.' Then he waves you through. Wait, really? What do you say?","choices":[{"label":"Wave him toward the road — \"Leave the post. Come now.\"","nextId":22,"women":"Abigail, Priscilla, Mary Magdalene","men":"Moses, Nehemiah, Joseph"},{"label":"\"Thank you. We won't forget this.\"","nextId":22,"women":"Deborah, Abigail, Miriam","men":"Elijah, Joseph, Paul"},{"label":"\"When you're ready — follow it.\"","nextId":22,"women":"Deborah, Priscilla, Martha","men":"Elijah, Nehemiah, Abraham"}],"isTransition":false,"isFinal":false,"col":13,"lane":2,"lanes":[0,1,2,3,4],"x":3680,"y":440},{"id":22,"text":"A stable. That's it? A stable. But the star is directly overhead, brighter than ever. And from inside — a baby crying. What do you do?","choices":[{"label":"Push through the stable door first","nextId":51,"women":"Priscilla, Miriam, Mary (Mother)","men":"David, Peter, Paul"},{"label":"Stop at the threshold — don't go in yet","nextId":51,"women":"Mary (Mother), Mary Magdalene, Martha","men":"Abraham, Paul, Barnabas"},{"label":"Catch someone's eye across the group — don't speak","nextId":51,"women":"Deborah, Ruth, Mary Magdalene","men":"Joseph, Peter, Barnabas"},{"label":"Drop to your knees right where you stand","nextId":51,"women":"Abigail, Ruth, Hannah","men":"Moses, Daniel, Paul"}],"isTransition":false,"isFinal":false,"col":14,"lane":2,"lanes":[0,1,2,3,4],"x":3960,"y":440},{"id":23,"subtitle":"Transition","text":"Dawn breaks. The journey is coming to an end, but one question remains.","choices":[{"label":"Continue","nextId":24,"women":"","men":"","isBridge":true}],"isTransition":true,"isFinal":false,"col":16,"lane":2,"lanes":[0,1,2,3,4],"x":4520,"y":440},{"id":24,"text":"Someone turns to you quietly and asks, 'What changed in you?'","choices":[{"label":"\"I learned the journey matters as much as where it leads.\"","nextId":27,"women":"Miriam, Ruth, Martha","men":"David, Joseph, Paul"},{"label":"\"I learned to trust — even when it didn't make sense.\"","nextId":27,"women":"Esther, Miriam, Hannah","men":"Moses, Nehemiah, Paul"},{"label":"\"I learned courage isn't the absence of fear. It's walking anyway.\"","nextId":27,"women":"Mary (Mother), Mary Magdalene, Martha","men":"Moses, Joseph, Peter"},{"label":"\"Still figuring that out. Ask me next year.\"","nextId":27,"women":"Abigail, Miriam, Mary Magdalene","men":"Peter, Paul, Barnabas"}],"isTransition":false,"isFinal":false,"col":17,"lane":2,"lanes":[0,1,2,3,4],"x":4800,"y":440},{"id":27,"text":"Standing in the stable, you take one last look at the star. What do you do with this moment?","choices":[{"label":"Make a quiet promise to yourself","nextId":13,"women":"Abigail, Ruth, Hannah","men":"Nehemiah, Daniel, Abraham"},{"label":"\"Goodbye, star. Thanks for the adventure.\"","nextId":13,"women":"Deborah, Esther, Mary Magdalene","men":"Elijah, Daniel, Paul"},{"label":"Look forward — to whatever's next","nextId":13,"women":"Deborah, Priscilla, Mary (Mother)","men":"Moses, David, Abraham"},{"label":"Look back — and honor everything it took to get here","nextId":13,"women":"Esther, Abigail, Martha","men":"David, Daniel, Peter"}],"isTransition":false,"isFinal":false,"col":18,"lane":2,"lanes":[0,1,2,3,4],"x":5080,"y":440},{"id":28,"text":"One of them holds up a stone. 'Bet you can't skip it more than me.' Ah yes. The universal language of children: competition.","choices":[{"label":"Crouch by the water — \"You're on.\"","nextId":45,"women":"Priscilla, Mary (Mother), Mary Magdalene","men":"Elijah, Nehemiah, Daniel"},{"label":"Take the stone — throw once, badly, on purpose","nextId":45,"women":"Miriam, Ruth, Mary (Mother)","men":"David, Daniel, Joseph"},{"label":"Ruffle the kid's hair — keep moving","nextId":45,"women":"Esther, Abigail, Mary (Mother)","men":"Nehemiah, Abraham, Paul"},{"label":"Hold out your hand — \"Show me how you hold it.\"","nextId":45,"women":"Abigail, Ruth, Hannah","men":"Elijah, Joseph, Paul"}],"isTransition":false,"isFinal":false,"col":3,"lane":2,"lanes":[2],"x":880,"y":440},{"id":30,"text":"The woman on the bench is still watching. Whether you sat with her for an hour or only paused long enough to bow goodbye, she studies your face — then nods. 'This star feels like a beginning. Don't give up.' Before you can respond, a young guy from the village jogs up, bag already packed. 'Can I come with you?' That was fast.","choices":[{"label":"Clap him on the shoulder — \"Fine. Fall in line.\"","nextId":46,"women":"Priscilla, Ruth, Hannah","men":"Elijah, Abraham, Paul"},{"label":"Look at his thin sandals — \"It's hard. You sure?\"","nextId":46,"women":"Miriam, Hannah, Martha","men":"Daniel, Peter, Barnabas"},{"label":"Turn to the grandmother — \"Do we have your blessing?\"","nextId":46,"women":"Esther, Mary Magdalene, Martha","men":"Nehemiah, Daniel, Paul"},{"label":"Point back toward the village — \"Did anyone at home say yes?\"","nextId":46,"women":"Deborah, Mary (Mother), Martha","men":"Joseph, Paul, Barnabas"}],"isTransition":false,"isFinal":false,"col":5,"lane":2,"lanes":[2],"x":1440,"y":440},{"id":32,"text":"Another group of travelers appears ahead — also following the star. They have much better supplies. Embarrassingly better. What's your move?","choices":[{"label":"Pick up the pace — close the gap before they disappear","nextId":19,"women":"Deborah, Priscilla, Mary (Mother)","men":"Moses, Nehemiah, Paul"},{"label":"Let them pull ahead — keep your group's pace","nextId":19,"women":"Deborah, Ruth, Hannah","men":"Nehemiah, Joseph, Barnabas"},{"label":"Shout across the gap — \"Hey! Where'd you get those packs?\"","nextId":19,"women":"Hannah, Mary (Mother), Martha","men":"Moses, David, Peter"}],"isTransition":false,"isFinal":false,"col":7,"lane":2,"lanes":[2],"x":2000,"y":440},{"id":33,"text":"You find an abandoned camp. Cold fire pit. Torn tent. Whoever was here left in a hurry.","choices":[{"label":"Comb through the ashes and torn canvas — look for tracks","nextId":34,"women":"Deborah, Mary (Mother), Mary Magdalene","men":"Moses, David, Paul"},{"label":"Salvage what's usable — food, cloth, anything dry","nextId":36,"women":"Esther, Hannah, Mary (Mother)","men":"David, Elijah, Nehemiah"},{"label":"Stand over the cold fire — say a short prayer and move on","nextId":34,"women":"Priscilla, Ruth, Mary Magdalene","men":"Moses, Elijah, Peter"},{"label":"Don't unpack — walk past without stopping","nextId":36,"women":"Deborah, Esther, Priscilla","men":"Daniel, Peter, Paul"}],"isTransition":false,"isFinal":false,"col":3,"lane":3,"lanes":[3,4],"x":880,"y":640},{"id":34,"text":"You find a journal. The last entry says: 'Something is following us.' The next page is blank. No one says anything for a moment.","choices":[{"label":"Close the journal — \"Nobody walks alone from here on.\"","nextId":37,"women":"Deborah, Abigail, Hannah","men":"Nehemiah, Abraham, Paul"},{"label":"Flip pages — \"They got farther than this. That means we can too.\"","nextId":37,"women":"Deborah, Ruth, Martha","men":"Elijah, Joseph, Abraham"},{"label":"Look at the tree line — \"Could we still catch them?\"","nextId":37,"women":"Abigail, Mary (Mother), Martha","men":"David, Daniel, Abraham"},{"label":"Slip the journal into your pack — walk without discussing it","nextId":37,"women":"Esther, Miriam, Mary Magdalene","men":"Joseph, Paul, Barnabas"}],"isTransition":false,"isFinal":false,"col":4,"lane":3,"lanes":[3],"x":1160,"y":640},{"id":36,"text":"That night — a noise. Something moving just outside the firelight. Everyone freezes. What do you do?","choices":[{"label":"Stand up — shout into the dark: \"WHO'S THERE?\"","nextId":37,"women":"Ruth, Hannah, Martha","men":"Joseph, Paul, Barnabas"},{"label":"Reach for a branch, rock, or cooking pot","nextId":37,"women":"Abigail, Hannah, Mary Magdalene","men":"Nehemiah, Abraham, Peter"},{"label":"Freeze — don't blink, don't breathe, just listen","nextId":37,"women":"Abigail, Mary (Mother), Martha","men":"Moses, Joseph, Abraham"},{"label":"Touch shoulders one by one — wake them without a word","nextId":37,"women":"Esther, Abigail, Miriam","men":"Daniel, Abraham, Barnabas"}],"isTransition":false,"isFinal":false,"col":4,"lane":4,"lanes":[4],"x":1160,"y":840},{"id":37,"subtitle":"Transition","text":"It's a fox. Just a fox. Everyone exhales. By morning, the wilderness gives way to farmland. Civilization. Finally.","choices":[{"label":"Continue","nextId":38,"women":"","men":"","isBridge":true}],"isTransition":true,"isFinal":false,"col":5,"lane":3,"lanes":[3,4],"x":1440,"y":640},{"id":38,"text":"A farmer spots you from his field and sets down his tools. 'You look like you've come a long way.' He glances up at the star, then back at you. 'Following it?' He doesn't seem surprised — just curious. How do you respond?","choices":[{"label":"Follow him to the house — accept food and a place to sleep","nextId":19,"women":"Ruth, Mary (Mother), Mary Magdalene","men":"Moses, Elijah, Paul"},{"label":"Ask before you eat — \"What have people said about that star?\"","nextId":19,"women":"Esther, Priscilla, Hannah","men":"David, Elijah, Barnabas"},{"label":"Pull out whatever map you have — \"Which road leads to Bethlehem?\"","nextId":19,"women":"Deborah, Priscilla, Mary Magdalene","men":"Moses, Nehemiah, Daniel"},{"label":"Roll up your sleeves — \"We'll work an hour, then go.\"","nextId":19,"women":"Priscilla, Miriam, Ruth","men":"Daniel, Peter, Paul"}],"isTransition":false,"isFinal":false,"col":6,"lane":3,"lanes":[3,4],"x":1720,"y":640},{"id":39,"text":"The shepherds have news — and it's not good. 'Soldiers ahead. A checkpoint on the main road.' Your stomach drops. The same soldiers who stripped that village bare. 'There IS a hidden path,' one shepherd offers, 'but I'd have to leave my flock.' He looks back at his sheep, then at you. The weight of the choice is written on his face.","choices":[{"label":"Take his directions — send him back to his sheep immediately","nextId":44,"women":"Abigail, Priscilla, Miriam","men":"Moses, David, Nehemiah"},{"label":"\"We saw what they did to that village. We have to go around.\"","nextId":44,"women":"Abigail, Hannah, Mary (Mother)","men":"Nehemiah, Peter, Barnabas"},{"label":"Split the group — volunteers stay with the flock while the rest follow the path","nextId":44,"women":"Deborah, Abigail, Ruth","men":"Moses, Elijah, Paul"},{"label":"Refuse the shortcut — backtrack and find a longer route on our own","nextId":44,"women":"Deborah, Hannah, Mary Magdalene","men":"Moses, Abraham, Barnabas"}],"isTransition":false,"isFinal":false,"col":8,"lane":0,"lanes":[0],"x":2280,"y":40},{"id":43,"text":"You wake up to SHOUTING. Torches in the darkness. Footsteps getting closer. Everyone is looking at you like you're in charge now. When did that happen?? You brace yourself — and then a voice calls out: 'Just shepherds! We saw your fire. Need help?' Your heart is still racing, but his voice is calm.","choices":[{"label":"Stand up, brush off the dirt, and call out a welcome","nextId":39,"women":"Esther, Miriam, Mary Magdalene","men":"David, Joseph, Paul"},{"label":"Let them come closer — but keep the fire between you and them","nextId":39,"women":"Priscilla, Ruth, Mary Magdalene","men":"David, Elijah, Daniel"},{"label":"Wave the kids behind you — \"Protect them first. Then we talk.\"","nextId":39,"women":"Mary (Mother), Mary Magdalene, Martha","men":"Joseph, Abraham, Peter"},{"label":"Grab the nearest adult's arm — whisper, \"You talk to them.\"","nextId":39,"women":"Miriam, Ruth, Martha","men":"Elijah, Nehemiah, Abraham"}],"isTransition":false,"isFinal":false,"col":7,"lane":0,"lanes":[0],"x":2000,"y":40},{"id":44,"text":"Morning. The shepherds share their bread as you leave. The hidden path worked — you're past the checkpoint. Everyone looks exhausted but somehow lighter. What's the move?","choices":[{"label":"Shoulder your pack and start walking before anyone else stalls","nextId":12,"women":"Esther, Ruth, Martha","men":"David, Joseph, Paul"},{"label":"Circle up — hold hands, one minute, then move","nextId":12,"women":"Priscilla, Mary Magdalene, Martha","men":"David, Elijah, Peter"},{"label":"Take the shepherd's bread — save half for whoever struggles later","nextId":12,"women":"Deborah, Esther, Priscilla","men":"Daniel, Joseph, Abraham"},{"label":"Make everyone drink water and check their feet before you leave","nextId":12,"women":"Esther, Mary (Mother), Mary Magdalene","men":"Elijah, Joseph, Barnabas"}],"isTransition":false,"isFinal":false,"col":9,"lane":0,"lanes":[0],"x":2560,"y":40},{"id":45,"text":"An older woman has been watching from a bench by the water — you realize she's been there the whole time. 'Star-followers,' she says, like she's confirming something to herself. 'Come. Sit. I want to hear where you're headed.'","choices":[{"label":"Sit on the bench — tell her the whole story from the star onward","nextId":30,"women":"Deborah, Abigail, Mary Magdalene","men":"David, Nehemiah, Peter"},{"label":"Ask first — \"You've been watching. What do you think it is?\"","nextId":30,"women":"Deborah, Priscilla, Miriam","men":"Moses, Peter, Paul"},{"label":"Bow your head — \"We can't stop long. But thank you.\"","nextId":30,"women":"Abigail, Priscilla, Martha","men":"Moses, David, Abraham"}],"isTransition":false,"isFinal":false,"col":4,"lane":2,"lanes":[2],"x":1160,"y":440},{"id":46,"text":"The path ahead is flooded. The only way across is a log that looks like it's held together by hope and moss. Fantastic. How do you handle this?","choices":[{"label":"Line up at the log — \"One at a time. Hand on the shoulder ahead of you.\"","nextId":32,"women":"Miriam, Ruth, Mary (Mother)","men":"Moses, Elijah, Daniel"},{"label":"Turn downstream — \"We find a bridge or we wade. No one crosses that yet.\"","nextId":32,"women":"Abigail, Priscilla, Martha","men":"David, Elijah, Nehemiah"},{"label":"Step onto the log — weight on the front foot, arms out","nextId":32,"women":     const graphEl = document.getElementById('graph');
    const timelineEl = document.getElementById('timeline');
    const detailEl = document.getElementById('detail');
    let activePath = 'all';
    let selectedId = null;

    function sceneById(id) { return DATA.nodes.find(n => n.id === id); }

    function pathSceneSet(key) {
      if (key === 'all') return new Set(DATA.nodes.map(n => n.id));
      return new Set(DATA.paths[key].scenes);
    }

    function renderDetail(id) {
      const scene = sceneById(id);
      if (!scene) return;
      selectedId = id;
      document.querySelectorAll('.node').forEach(n => n.classList.toggle('selected', Number(n.dataset.id) === id));
      let html = '<h2>Scene ' + scene.id + (scene.subtitle ? ' — ' + esc(scene.subtitle) : '') + '</h2>';
      html += '<div class="scene-text">' + esc(scene.text) + '</div>';
      if (!scene.choices.length) {
        html += '<p class="empty">No choices (dead end in doc).</p>';
      } else {
        html += '<h3 style="margin:0 0 10px;font-size:1rem">Choices</h3>';
        for (const c of scene.choices) {
          const next = c.nextId === 'RESULT' ? 'RESULT (end of quiz)' : 'Scene ' + c.nextId;
          html += '<div class="choice-block"><strong>' + esc(c.label) + '</strong><div class="next">→ ' + next + '</div>';
          if (c.women || c.men) html += '<div class="scores">Women: ' + esc(c.women) + '<br>Men: ' + esc(c.men) + '</div>';
          html += '</div>';
        }
      }
      detailEl.innerHTML = html;
    }

    function esc(s) {
      return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function renderGraph() {
      graphEl.innerHTML = '';
      const allowed = pathSceneSet(activePath);
      const w = 40 + (DATA.maxCol + 1) * 280;
      const h = 40 + 5 * 200;
      graphEl.style.width = w + 'px';
      graphEl.style.height = h + 'px';

      const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      svg.setAttribute('class', 'edges');
      svg.setAttribute('width', w);
      svg.setAttribute('height', h);
      graphEl.appendChild(svg);

      const nodePos = {};
      for (const node of DATA.nodes) {
        const el = document.createElement('div');
        el.className = 'node' + (node.isTransition ? ' bridge' : '') + (node.isFinal ? ' final' : '');
        el.dataset.id = node.id;
        el.style.left = node.x + 'px';
        el.style.top = node.y + 'px';
        if (!allowed.has(node.id)) el.classList.add('dim');
        el.innerHTML = '<div class="id">Scene ' + node.id + '</div>' +
          (node.subtitle ? '<div class="sub">' + esc(node.subtitle) + '</div>' : '') +
          '<div class="preview">' + esc(node.text) + '</div>';
        el.onclick = () => renderDetail(node.id);
        graphEl.appendChild(el);
        nodePos[node.id] = { x: node.x + 110, y: node.y + 40 };
      }

      for (const edge of DATA.edges) {
        if (!allowed.has(edge.from) || !allowed.has(edge.to)) continue;
        const a = nodePos[edge.from];
        const b = nodePos[edge.to];
        if (!a || !b) continue;
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        const mx = (a.x + b.x) / 2;
        path.setAttribute('d', 'M' + a.x + ',' + a.y + ' C' + mx + ',' + a.y + ' ' + mx + ',' + b.y + ' ' + b.x + ',' + b.y);
        path.setAttribute('fill', 'none');
        path.setAttribute('stroke', '#94a3b8');
        path.setAttribute('stroke-width', '1.5');
        path.setAttribute('marker-end', 'url(#arrow)');
        svg.appendChild(path);
      }

      const defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
      defs.innerHTML = '<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker>';
      svg.prepend(defs);
    }

    function renderTimeline() {
      const key = activePath === 'all' ? 'valley' : activePath;
      const path = DATA.paths[key];
      timelineEl.innerHTML = '<h2 style="margin-top:0">' + esc(path.label) + ' — linear walkthrough</h2>';
      for (const id of path.scenes) {
        const scene = sceneById(id);
        if (!scene) continue;
        const div = document.createElement('div');
        div.className = 'step';
        div.style.borderColor = path.color;
        div.innerHTML = '<h3>Scene ' + scene.id + (scene.subtitle ? ' — ' + esc(scene.subtitle) : '') + '</h3><p>' + esc(scene.text) + '</p>';
        if (scene.choices.length) {
          const ul = document.createElement('ul');
          ul.className = 'choices';
          for (const c of scene.choices) {
            const li = document.createElement('li');
            const next = c.nextId === 'RESULT' ? 'RESULT' : 'Scene ' + c.nextId;
            li.innerHTML = '<strong>' + esc(c.label) + '</strong> → ' + next;
            ul.appendChild(li);
          }
          div.appendChild(ul);
        }
        div.style.cursor = 'pointer';
        div.onclick = () => renderDetail(id);
        timelineEl.appendChild(div);
      }
    }

    document.querySelectorAll('.path-btn').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('.path-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activePath = btn.dataset.path;
        renderGraph();
        renderTimeline();
      };
    });

    document.getElementById('view-graph').onclick = () => {
      document.getElementById('view-graph').classList.add('active');
      document.getElementById('view-timeline').classList.remove('active');
      graphEl.style.display = 'block';
      timelineEl.classList.remove('active');
    };
    document.getElementById('view-timeline').onclick = () => {
      document.getElementById('view-timeline').classList.add('active');
      document.getElementById('view-graph').classList.remove('active');
      graphEl.style.display = 'none';
      timelineEl.classList.add('active');
      renderTimeline();
    };

    document.getElementById('jump-scene').onchange = (e) => {
      const id = Number(e.target.value);
      if (sceneById(id)) {
        renderDetail(id);
        const node = document.querySelector('.node[data-id="' + id + '"]');
        if (node) node.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'center' });
      }
    };

    renderGraph();
    renderTimeline();
    renderDetail(1);
  </script>
</body>
</html>
